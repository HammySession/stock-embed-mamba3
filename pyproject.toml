[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-embed-mamba3"
version = "0.1.0"
description = "Data preparation and loader for the stock-embed-mamba3 Mamba-3 encoder"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
# mamba_ssm is deliberately absent: it is a source build (see docker/Dockerfile).
model = ["torch", "safetensors>=0.4"]
test = ["pytest>=8", "huggingface_hub>=0.20"]
examples = ["yfinance>=0.2.50", "matplotlib>=3.8", "scikit-learn>=1.4", "huggingface_hub>=0.20"]

[project.urls]
Weights = "https://huggingface.co/HamSession/stock-embed-mamba3"

[tool.setuptools.packages.find]
include = ["stock_embed_mamba3*"]

[tool.ruff]
line-length = 120
